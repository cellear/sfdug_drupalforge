uuid: 3f2ab8d5-f576-43e9-b92f-6aed18f8efa6
langcode: en
status: true
dependencies:
  module:
    - eca_base
    - eca_content
    - modeler_api
third_party_settings:
  modeler_api:
    modeler_id: bpmn_io
    label: 'Comment moderation notice'
id: comment_moderation_notice
weight: 0
template: null
events:
  comment_insert:
    plugin: 'content_entity:insert'
    label: 'New Discussion comment saved'
    configuration:
      type: 'comment meeting_comment'
    successors:
      -
        id: email_moderator
        condition: comment_unpublished
conditions:
  comment_unpublished:
    plugin: eca_entity_field_value
    label: 'Awaiting approval?'
    configuration:
      negate: false
      expected_value: '0'
      field_name: status
      operator: equal
      type: value
      case: false
      entity: comment
gateways: {  }
actions:
  email_moderator:
    label: 'Email the moderator'
    plugin: action_send_email_action
    configuration:
      recipient: luke@kiza.com
      subject: 'sfdug.org: comment awaiting approval on "[comment:entity:title]"'
      message: |-
        A new comment is waiting for approval on sfdug.org.

        Page: [comment:entity:title]
        [comment:entity:url]

        From: [comment:author]

        [comment:body]

        Approve or delete it at [site:url]admin/content/comment/approval
    successors: {  }
